<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src reelet-graphic:;">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden}#stage{position:relative;overflow:hidden;background:#000}.layer{position:absolute;inset:0;transform-origin:center;display:none}.layer canvas{position:absolute;width:100%;height:100%;object-fit:contain}.layer iframe{position:absolute;left:50%;top:50%;border:0;transform-origin:center}#token{position:absolute;right:0;width:8px;height:8px}
</style></head><body><div id="stage"></div><div id="token"></div><script>
const setup=window.reeletFrames.getSetup(),stage=document.getElementById('stage'),layers=new Map(),pending=new Map();let requestId=0;
stage.style.width=setup.width+'px';stage.style.height=setup.height+'px';document.getElementById('token').style.top=setup.height+'px';
const loads=[];
for(const clip of setup.clips){if(clip.kind==='audio')continue;const layer=document.createElement('div');layer.className='layer';stage.append(layer);let content;
  if(clip.kind==='graphic'){
    const graphic=setup.graphics[clip.mediaId];if(!graphic)throw new Error('Missing accepted graphic');
    content=document.createElement('iframe');content.sandbox='allow-scripts';content.allow='';content.style.width=graphic.width+'px';content.style.height=graphic.height+'px';
    content.style.transform=`translate(-50%,-50%) scale(${Math.min(setup.width/graphic.width,setup.height/graphic.height)})`;
    loads.push(new Promise((resolve,reject)=>{content.onload=resolve;content.onerror=()=>reject(new Error('Graphic could not load'));}));
    content.src=graphic.url;
  }else{content=document.createElement('canvas');content.id='media-'+clip.id;}
  layer.append(content);layers.set(clip.id,{layer,content,kind:clip.kind});
}
window.addEventListener('message',e=>{const d=e.data,p=pending.get(d?.requestId);if(!p||e.source!==p.source)return;if(d.type==='reelet-ready'){pending.delete(d.requestId);p.resolve();}else if(d.type==='reelet-error'){pending.delete(d.requestId);p.reject(new Error(d.error||'Graphic render failed'));}});
window.ready=Promise.all(loads).then(()=>document.fonts.ready);
function graphicFrame(frame,time){return new Promise((resolve,reject)=>{const id=++requestId;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Graphic did not acknowledge explicit time within 10 seconds'));},10000);pending.set(id,{source:frame.contentWindow,resolve:()=>{clearTimeout(timer);resolve();},reject:e=>{clearTimeout(timer);reject(e);}});frame.contentWindow.postMessage({type:'reelet-render',requestId:id,time},'*');});}
window.renderFrame=async(items,token)=>{
  await window.ready;
  for(const {layer}of layers.values())layer.style.display='none';
  const graphics=[];
  for(const item of items){const entry=layers.get(item.clipId);if(!entry)continue;const {layer,content,kind}=entry,tr=item.transform;
    layer.style.display='block';layer.style.zIndex=String(item.track*10000+items.indexOf(item));layer.style.opacity=String(item.opacity);
    layer.style.transform=`translate(${tr.x||0}px,${tr.y||0}px) rotate(${tr.rotation||0}deg) scale(${tr.scale||1})`;
    if(kind==='graphic')graphics.push(graphicFrame(content,item.sourceTime));else content.style.objectFit=tr.fit==='fill'?'cover':'contain';
  }
  const stats=await window.reeletFrames.draw(items);
  await Promise.all(graphics);
  if(graphics.length){await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);}
  document.getElementById('token').style.backgroundColor=`rgb(${token&255},${(token>>8)&255},${(token>>16)&255})`;
  document.body.getBoundingClientRect();return stats;
};
</script></body></html>
