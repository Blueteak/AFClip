<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent}canvas{position:absolute;inset:0;width:100%;height:100%}</style>
<canvas id="output"></canvas><script>
const canvas=document.getElementById('output'),ctx=canvas.getContext('2d');
function size(w,h){if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;ctx.clearRect(0,0,w,h);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';}

const mosaic=new OffscreenCanvas(1,1),mc=mosaic.getContext('2d');
window.render=({width:w,height:h,inputs:[a,b],progress:p,params:q})=>{size(w,h);p=p*p*(3-2*p);ctx.save();const slope=q.slant*w*(q.reverse?-1:1),band=q.pixelBand,travel=p*(w+Math.abs(slope)+2*band)-Math.abs(slope)/2-band,edge=q.reverse?w-travel:travel;
ctx.drawImage(a,0,0,w,h);
function polygon(left,right){ctx.beginPath();ctx.moveTo(left-slope/2,0);ctx.lineTo(right-slope/2,0);ctx.lineTo(right+slope/2,h);ctx.lineTo(left+slope/2,h);ctx.closePath();}
if(band>0&&p>0&&p<1){mosaic.width=Math.max(1,Math.round(w/24));mosaic.height=Math.max(1,Math.round(h/24));mc.drawImage(a,0,0,mosaic.width,mosaic.height);ctx.save();polygon(q.reverse?edge-band:edge,q.reverse?edge:edge+band);ctx.clip();ctx.imageSmoothingEnabled=false;ctx.drawImage(mosaic,0,0,w,h);ctx.restore();}
ctx.save();polygon(q.reverse?edge:-w*3,q.reverse?w*3:edge);ctx.clip();ctx.clearRect(-w*3,0,w*6,h);ctx.drawImage(b,0,0,w,h);ctx.restore();
if(q.glow&&p>0&&p<1){ctx.beginPath();ctx.moveTo(edge-slope/2,0);ctx.lineTo(edge+slope/2,h);ctx.strokeStyle=q.color;ctx.lineWidth=2;ctx.shadowColor=q.color;ctx.shadowBlur=q.glow;ctx.stroke();ctx.shadowBlur=0;}ctx.restore();return canvas;};
</script>
