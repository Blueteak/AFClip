<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: afclip-media:; media-src afclip-media:; frame-src afclip-graphic:; connect-src afclip-media:">
  <title>AFClip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon set: 24px grid, 1.75 stroke. Referenced with <use href="#i-name">. -->
  <svg class="sprite" aria-hidden="true">
    <defs><linearGradient id="mark-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aaeff"/><stop offset="1" stop-color="#3a7bea"/></linearGradient></defs>
    <symbol id="i-mark" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="url(#mark-gradient)" stroke="none"/><path d="M8.5 17.5V10a3 3 0 0 1 3-3h4" stroke="#fff" stroke-width="2.6"/><circle cx="16" cy="13.5" r="1.7" fill="#fff" stroke="none"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>

    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 6v12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-4.6-4.6a1.5 1.5 0 0 0-2.1 0L6 20"/></symbol>
    <symbol id="i-graphic" viewBox="0 0 24 24"><path d="m17 16 4-4-4-4"/><path d="m7 8-4 4 4 4"/><path d="m14 5-4 14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.7 5.1A9.6 9.6 0 0 1 12 5c6 0 9.5 7 9.5 7a15 15 0 0 1-2 2.9"/><path d="M6.6 6.6A15.4 15.4 0 0 0 2.5 12S6 19 12 19a9 9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 7.6-1.7"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.5" height="14" rx=".8" fill="currentColor"/><rect x="14" y="5" width="3.5" height="14" rx=".8" fill="currentColor"/></symbol>
    <symbol id="i-to-start" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18.5 6.2v11.6a.7.7 0 0 1-1.1.6L9.5 12.6a.7.7 0 0 1 0-1.2l7.9-5.8a.7.7 0 0 1 1.1.6z" fill="currentColor"/></symbol>
    <symbol id="i-to-end" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5.5 6.2v11.6a.7.7 0 0 0 1.1.6l7.9-5.8a.7.7 0 0 0 0-1.2L6.6 5.6a.7.7 0 0 0-1.1.6z" fill="currentColor"/></symbol>
    <symbol id="i-prev-edit" viewBox="0 0 24 24"><path d="M5 4v16"/><path d="M20 12H9"/><path d="m13 8-4 4 4 4"/></symbol>
    <symbol id="i-next-edit" viewBox="0 0 24 24"><path d="M19 4v16"/><path d="M4 12h11"/><path d="m11 8 4 4-4 4"/></symbol>
    <symbol id="i-step-back" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-step-forward" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-render" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m14.3 8 5.7 9.9M9.7 8h11.5M7.4 12l5.7-9.9M9.7 16 4 6.1M14.3 16H2.8M16.6 12l-5.7 9.9"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M5 4.2a.6.6 0 0 1 .8-.8l13.5 5.3a.6.6 0 0 1 0 1.1l-5.4 1.7a1.2 1.2 0 0 0-.8.8l-1.7 5.4a.6.6 0 0 1-1.1 0z"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 3h4v8a2 2 0 0 0 4 0V3h4"/><path d="M6 7h4M14 7h4"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 12h18"/><path d="m7 8-4 4 4 4M17 8l4 4-4 4"/><path d="M3 4v2M21 4v2M3 18v2M21 18v2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-add-track" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><path d="M3 15h8M3 20h8M17 14v7M13.5 17.5h7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-marker" viewBox="0 0 24 24"><path d="M6 3.5h12v10.2L12 20l-6-6.3z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.2 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx=".5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16M18 6.5V19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6.5M9 6.5V4.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4.5v2"/></symbol>
    <symbol id="i-dissolve" viewBox="0 0 24 24"><path d="M2 7h3.5c5 0 8 10 13 10H22"/><path d="M2 17h3.5c5 0 8-10 13-10H22"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="4" rx="1"/><path d="M16 4.5h2a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24"><path d="M10 4H6v16h4"/><path d="M13 12h6"/><path d="m16 9 3 3-3 3"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h4v16h-4"/><path d="M5 12h6"/><path d="m8 9 3 3-3 3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.6-2.7 2.6M12 17h.01"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-speed" viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.5 18a9.5 9.5 0 1 1 17 0"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-fade" viewBox="0 0 24 24"><path d="M3 19 12 5h9"/><path d="M3 19h18" opacity=".45"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
    <symbol id="i-link-off" viewBox="0 0 24 24"><path d="M15.66 14l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M8.34 10l-3 3a4 4 0 0 0 5.66 5.66l1-1"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></symbol>
  </svg>

  <header class="titlebar">
    <svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>
    <nav id="menubar" class="menubar" aria-label="Application menu"></nav>
    <div class="title-center">
      <button id="command-center" class="command-center"><svg class="icon"><use href="#i-search"/></svg><span id="project-name">Opening project</span><span class="kbd-group" id="command-center-keys"></span></button>
    </div>
    <div class="title-actions">
      <button id="undo" class="icon-button"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button id="redo" class="icon-button"><svg class="icon"><use href="#i-redo"/></svg></button>
      <span class="divider"></span>
      <button id="export" class="export-button"><svg class="icon"><use href="#i-export"/></svg><span>Export</span></button>
    </div>
  </header>

  <main id="workspace">
    <section class="panel bin" style="grid-area:bin">
      <div class="panel-tabs" role="tablist">
        <button class="tab active" data-tab="media" role="tab">Media <span id="media-count" class="count"></span></button>
        <button class="tab" data-tab="history" role="tab">History</button>
        <span class="tab-spacer"></span>
        <button id="import" class="icon-button small"><svg class="icon"><use href="#i-import"/></svg></button>
      </div>
      <div class="tab-page" data-page="media">
        <div class="media-search">
          <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search names, tags, notes" aria-label="Search project media by name, tag or notes" spellcheck="false"></label>
          <button id="add-library" class="icon-button small" aria-label="Add clips from content library"><svg class="icon"><use href="#i-plus"/></svg></button>
        </div>
        <div id="media-list" class="media-list" tabindex="0"></div>
      </div>
      <div class="tab-page" data-page="history" hidden>
        <div id="history-panel" class="history-panel"></div>
      </div>
    </section>
    <div class="splitter v" data-split="left" style="grid-area:s1"></div>

    <section id="monitor" class="panel monitor" style="grid-area:mon">
      <div class="panel-tabs">
        <button class="tab active" data-view="frame">Program</button>
        <button class="tab" data-view="source" id="source-tab" hidden>Source</button>
        <button class="tab" data-view="export" id="export-tab" hidden>Export</button>
        <span class="tab-spacer"></span>
        <span id="frame-state" class="frame-state"></span>
      </div>
      <div id="stage" class="stage">
        <div id="stage-busy" class="stage-busy" hidden></div>
        <img id="preview" alt="Composited project frame" hidden>
        <div id="native-preview" hidden></div>
        <video id="export-video" hidden></video>
        <div id="source-stage" class="source-stage" hidden></div>
        <div id="stage-empty" class="stage-empty"></div>
      </div>
      <div id="mini-ruler" class="mini-ruler"><div id="mini-range" class="mini-range"></div><div id="mini-playhead" class="mini-playhead"></div></div>
      <div id="source-panel" class="source-panel" hidden>
        <div id="source-strip" class="source-strip"></div>
        <div class="transport">
          <span id="source-time" class="timecode source-time"></span>
          <div class="transport-buttons" id="source-buttons"></div>
          <div class="transport-right"><span id="source-duration" class="duration"></span></div>
        </div>
      </div>
      <div id="program-transport" class="transport">
        <input id="timecode" class="timecode" spellcheck="false" autocomplete="off">
        <div class="transport-buttons" id="transport-buttons"></div>
        <div class="transport-right"><span id="duration" class="duration"></span></div>
      </div>
    </section>
    <div class="splitter v" data-split="right" style="grid-area:s2"></div>

    <section class="panel inspector" style="grid-area:insp">
      <div class="panel-tabs"><span class="tab active static" id="inspector-title">Inspector</span><span class="tab-spacer"></span><span id="inspector-kind" class="inspector-kind"></span></div>
      <div id="inspector" class="inspector-body"></div>
    </section>

    <div class="splitter h" data-split="timeline" style="grid-area:s3"></div>

    <section class="panel timeline" style="grid-area:tl">
      <div class="timeline-bar">
        <div class="tool-group" id="tool-group"></div>
        <span class="divider"></span>
        <div class="tool-group" id="edit-group"></div>
        <span class="tool-spacer"></span>
        <span id="lock-banner" class="lock-banner" hidden><svg class="icon"><use href="#i-lock"/></svg>Edits locked while exporting</span>
        <div class="tool-group" id="zoom-group"></div>
      </div>
      <div id="tl-scroll" class="tl-scroll">
        <div id="tl-inner" class="tl-inner">
          <div class="ruler-row">
            <div class="ruler-corner"><span id="tl-timecode" class="tl-timecode"></span></div>
            <div id="ruler" class="ruler"></div>
          </div>
          <div id="tracks" class="tracks">
            <div id="tl-overlay" class="tl-overlay"><div id="tl-range" class="tl-range" hidden></div><div id="snapline" class="snapline" hidden></div><div id="marquee" class="marquee" hidden></div><div id="playhead" class="playhead"></div></div>
          </div>
          <div id="tl-empty" class="tl-drop"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="connection-dot" class="dot"></span>
    <span id="status" class="status" role="status">Connecting</span>
    <span id="hint" class="hint"></span>
    <span class="status-spacer"></span>
    <span id="job-chip" class="job-chip" hidden></span>
    <button id="mode-chip" class="status-button"></button>
    <span id="save-status" class="save-status"></span>
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="drag-readout" class="drag-readout" hidden></div>
  <div id="layer" class="layer"></div>
  <div id="toasts" class="toasts"></div>
  <script src="../render/timeline.cjs"></script>
  <script src="../shared/asset.cjs"></script>
  <script src="../render/asset-runtime.js"></script>
  <script src="native-preview.js"></script>
  <script src="playback.js"></script>
  <script src="audio-waveform.js"></script>
  <script src="source-preview.js"></script>
  <script src="app.js"></script>
</body>
</html>
