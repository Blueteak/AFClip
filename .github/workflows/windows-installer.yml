name: Windows installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional build version, such as 0.1.1 or 0.1.1-nightly.1
        type: string
        required: false
      publish:
        description: Publish a signed release and its update feed
        type: boolean
        default: false
      publish_test:
        description: Publish an unsigned prerelease in the private repository
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - name: Set requested version
        if: inputs.version != ''
        env:
          AFCLIP_BUILD_VERSION: ${{ inputs.version }}
        run: |
          if ($env:AFCLIP_BUILD_VERSION -notmatch '^\d+\.\d+\.\d+(-nightly\.\d+)?$') { throw 'Use a stable or nightly version' }
          npm version $env:AFCLIP_BUILD_VERSION --no-git-tag-version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check publication prerequisites
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (!(Test-Path LICENSE)) { throw 'Choose and commit a license before publication' }
          $private = gh api repos/${{ github.repository }} --jq '.private'
          if ($LASTEXITCODE -or $private -ne 'false') { throw 'Public release hosting requires a public repository' }
          if (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD) { throw 'Windows signing credentials are required for publication' }
      - name: Check private test publication
        if: inputs.publish_test
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_PUBLICATION: ${{ inputs.publish }}
        run: |
          if ($env:SIGNED_PUBLICATION -eq 'true') { throw 'Choose either publish or publish_test' }
          $private = gh api repos/${{ github.repository }} --jq '.private'
          if ($LASTEXITCODE -or $private -ne 'true') { throw 'Test publication requires a private repository' }
      - name: Generate release presentation
        if: inputs.publish || inputs.publish_test
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/generate-release-notes.cjs $version '${{ github.sha }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          AFCLIP_RELEASE_UPDATES: ${{ inputs.publish && '1' || '0' }}
        run: npm run dist:win
      - name: Retain installer and compatibility metadata
        uses: actions/upload-artifact@v4
        with:
          name: AFClip-Windows-${{ inputs.version || 'current' }}-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/nightly.yml
            build/release.json
            build/release-notes.md
            build/release-title.txt
          if-no-files-found: error
      - name: Publish explicit stable or nightly release
        if: inputs.publish || inputs.publish_test
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_PUBLICATION: ${{ inputs.publish_test }}
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/generate-release-notes.cjs $version '${{ github.sha }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $title = (Get-Content build/release-title.txt -Raw).Trim()
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.blockmap' -or $_.Name -in 'latest.yml','nightly.yml' } | ForEach-Object FullName)
          $args = @('release','create',"v$version",'--target','${{ github.sha }}','--title',$title,'--notes-file','build/release-notes.md')
          if ($version -match '-nightly\.' -or $env:TEST_PUBLICATION -eq 'true') { $args += '--prerelease' }
          gh @args @files 'build/release.json'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
