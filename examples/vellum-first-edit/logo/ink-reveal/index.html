<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent}canvas{position:absolute;inset:0;width:100%;height:100%}</style>
<canvas id="output"></canvas><script>
// Ink spreads outward from an impact point: a seeded value-noise threshold mask,
// built at 1/8 resolution and upscaled for soft organic edges, plus an overshoot punch.
const out = document.getElementById('output'), mask = new OffscreenCanvas(1, 1), M = 8;
const clamp = x => Math.max(0, Math.min(1, x)), smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
let lattice, latticeSeed;
function noise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const h = (a, b) => lattice[((a & 63) << 6) | (b & 63)];
  return (h(i, j) * (1 - u) + h(i + 1, j) * u) * (1 - v) + (h(i, j + 1) * (1 - u) + h(i + 1, j + 1) * u) * v;
}
window.render = ({ width, height, time, inputs: [image], params: p, seed, random }) => {
  if (out.width !== width) out.width = width;
  if (out.height !== height) out.height = height;
  const ctx = out.getContext('2d'), k = (time - p.start) / p.duration;
  ctx.clearRect(0, 0, width, height);
  if (k <= 0) return out;
  const cx = p.centerX * width, cy = p.centerY * height;
  ctx.save();
  // Punch: ink starts undersized, overshoots and settles.
  const s = 1 - p.punch + p.punch * back(k * 1.4);
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  ctx.drawImage(image, 0, 0);
  ctx.restore();
  if (k >= 1) return out;
  if (latticeSeed !== seed) { lattice = Float32Array.from({ length: 4096 }, random); latticeSeed = seed; }
  const mw = Math.ceil(width / M), mh = Math.ceil(height / M);
  if (mask.width !== mw) mask.width = mw;
  if (mask.height !== mh) mask.height = mh;
  const mctx = mask.getContext('2d'), data = mctx.createImageData(mw, mh), d = data.data;
  // Radius grows fast then slows, like a splash; noise pushes the front irregularly.
  const reach = Math.hypot(Math.max(cx, width - cx), Math.max(cy, height - cy)) / M;
  const front = (1 - (1 - smooth(k)) ** 2) * reach * (1 + p.roughness), soft = 3;
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
    const r = Math.hypot(x - cx / M, y - cy / M);
    const n = noise(x * .09, y * .09) * .65 + noise(x * .27 + 40, y * .27) * .35;
    const a = clamp((front - r * (1 + p.roughness * 2 * n)) / soft);
    d[(y * mw + x) * 4 + 3] = a * 255;
  }
  mctx.putImageData(data, 0, 0);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(mask, 0, 0, width, height);
  ctx.globalCompositeOperation = 'source-over';
  return out;
};
</script>
